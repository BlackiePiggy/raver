<svg xmlns="http://www.w3.org/2000/svg" width="390" height="700" viewBox="0 0 390 700" style="background:#000">
  <defs>
    <linearGradient id="posterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.92"/>
    </linearGradient>
    <pattern id="poster" patternUnits="userSpaceOnUse" width="390" height="260">
      <image width="390" height="260" href="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1600"/>
    </pattern>
  </defs>

  <!-- 卡片背景 -->
  <rect x="0" y="0" width="390" height="700" rx="30" fill="#0f0f11" stroke="#222" stroke-width="1"/>

  <!-- 顶部 -->
  <rect x="0" y="0" width="390" height="60" rx="30" fill="#ffffff08" stroke="#ffffff08" stroke-width="0.5"/>
  <text x="20" y="38" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ccc" letter-spacing="0.3em">RAVEHUB ACCESS</text>

  <!-- 海报区域 -->
  <rect x="0" y="60" width="390" height="260" fill="url(#poster)"/>
  <rect x="0" y="60" width="390" height="260" fill="url(#posterGrad)"/>

  <!-- 渐变光 -->
  <rect x="0" y="60" width="390" height="260" fill="transparent" style="background:linear-gradient(45deg,#ff000010,transparent)"/>

  <!-- 活动名称（左下角） -->
  <text x="20" y="290" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#fff" letter-spacing="0.18em">SUMMER FESTIVAL 2026</text>

  <!-- glitch 线条 -->
  <line x1="0" y1="90" x2="390" y2="90" stroke="#ff000033" stroke-width="2"/>
  <line x1="0" y1="130" x2="390" y2="130" stroke="#ff000033" stroke-width="1"/>
  <line x1="0" y1="155" x2="390" y2="155" stroke="#ff000033" stroke-width="3"/>
  <line x1="0" y1="190" x2="390" y2="190" stroke="#ff000033" stroke-width="2"/>
  <line x1="0" y1="225" x2="390" y2="225" stroke="#ff000033" stroke-width="1"/>
  <line x1="0" y1="250" x2="390" y2="250" stroke="#ff000033" stroke-width="2"/>

  <!-- 锯齿分割线 -->
  <g transform="translate(0,320)">
    <path d="M0,10 L7,0 L14,10 L21,0 L28,10 L35,0 L42,10 L49,0 L56,10 L63,0 L70,10 L77,0 L84,10 L91,0 L98,10 L105,0 L112,10 L119,0 L126,10 L133,0 L140,10 L147,0 L154,10 L161,0 L168,10 L175,0 L182,10 L189,0 L196,10 L203,0 L210,10 L217,0 L224,10 L231,0 L238,10 L245,0 L252,10 L259,0 L266,10 L273,0 L280,10 L287,0 L294,10 L301,0 L308,10 L315,0 L322,10 L329,0 L336,10 L343,0 L350,10 L357,0 L364,10 L371,0 L378,10 L385,0 L392,10" fill="#000"/>
  </g>

  <!-- 内容区域 -->
  <g font-family="Arial, sans-serif" fill="#e0e0e0">
    <!-- 标签 -->
    <text x="20" y="370" font-size="11" fill="#666" letter-spacing="0.25em">START</text>
    <text x="20" y="388" font-size="17" font-weight="bold">Jun 20, 2026</text>

    <text x="200" y="370" font-size="11" fill="#666" letter-spacing="0.25em">END</text>
    <text x="200" y="388" font-size="17" font-weight="bold">Jun 22, 2026</text>

    <text x="20" y="418" font-size="11" fill="#666" letter-spacing="0.25em">DURATION</text>
    <text x="20" y="436" font-size="17" font-weight="bold">3 Days</text>

    <text x="200" y="418" font-size="11" fill="#666" letter-spacing="0.25em">LINEUP</text>
    <text x="200" y="436" font-size="17" font-weight="bold">48 Artists</text>

    <text x="20" y="466" font-size="11" fill="#666" letter-spacing="0.25em">VENUE</text>
    <text x="20" y="484" font-size="16" font-weight="bold">上海梦幻岛户外演出基地 · Zone B</text>

    <text x="20" y="514" font-size="11" fill="#666" letter-spacing="0.25em">PRESENTED BY</text>
    <text x="20" y="532" font-size="17" font-weight="bold">RaveHub × Surge Collective</text>
  </g>

  <!-- 分割线 -->
  <line x1="20" y1="550" x2="370" y2="550" stroke="#ffffff1a" stroke-width="1"/>

  <!-- 底部 -->
  <text x="20" y="580" font-family="Arial" font-size="11" fill="#888" letter-spacing="0.25em">RAVEHUB ACCESS</text>

  <!-- 二维码区域 -->
  <rect x="250" y="565" width="120" height="50" rx="12" fill="transparent"/>
  <text x="265" y="585" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">Scan</text>
  <text x="265" y="602" font-size="11" fill="#888">RaveHub App</text>
  <image x="330" y="565" width="40" height="40" href="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://ravehub.app"/>
</svg>