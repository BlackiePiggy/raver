        name:
          type: string
        price:
          type: number
        currency:
          type:
            - string
            - 'null'
        sortOrder:
          type:
            - integer
            - 'null'
    EventLineupArtistInput:
      type: object
      additionalProperties: false
      required:
        - djName
      properties:
        id:
          type:
            - string
            - 'null'
        djId:
          type:
            - string
            - 'null'
        memberDjIds:
          type:
            - array
            - 'null'
          items:
            type:
              - string
              - 'null'
        memberNames:
          type:
            - array
            - 'null'
          items:
            type: string
        djName:
          type: string
        sortOrder:
          type:
            - integer
            - 'null'
    EventLineupSlotInput:
      type: object
      additionalProperties: false
      required:
        - djName
      properties:
        id:
          type:
            - string
            - 'null'
        lineupArtistId:
          type:
            - string
            - 'null'
        eventDayId:
          type:
            - string
            - 'null'
        weekIndex:
          type:
            - integer
            - 'null'
        dayIndexInWeek:
          type:
            - integer
            - 'null'
        overallDayIndex:
          type:
            - integer
            - 'null'
        localDate:
          type:
            - string
            - 'null'
          format: date
        djId:
          type:
            - string
            - 'null'
        memberDjIds:
          type:
            - array
            - 'null'
          items:
            type:
              - string
              - 'null'
        memberNames:
          type:
            - array
            - 'null'
          items:
            type: string
        festivalDayIndex:
          type:
            - integer
            - 'null'
        djName:
          type: string
        stageName:
          type:
            - string
            - 'null'
        sortOrder:
          type:
            - integer
            - 'null'
        startTime:
          type:
            - string
            - 'null'
        endTime:
          type:
            - string
            - 'null'
    EventMutationBase:
      type: object
      additionalProperties: false
      required:
        - name
        - startDate
        - endDate
      properties:
        name:
          type: string
        nameI18n:
          $ref: '#/components/schemas/LocalizedText'
          nullable: true
        wikiFestivalId:
          type:
            - string
            - 'null'
        abbreviation:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
        eventType:
          type:
            - string
            - 'null'
        organizerName:
          type:
            - string
            - 'null'
        venueName:
          type:
            - string
            - 'null'
        venueAddress:
          type:
            - string
            - 'null'
        sourceEventUrl:
          type:
            - string
            - 'null'
        sourceProvider:
          type:
            - string
            - 'null'
        referenceLinks:
          type:
            - array
            - 'null'
          items:
            type: string
        socialLinks:
          nullable: true
        city:
          type:
            - string
            - 'null'
        cityI18n:
          $ref: '#/components/schemas/LocalizedText'
          nullable: true
        country:
          type:
            - string
            - 'null'
        countryI18n:
          $ref: '#/components/schemas/LocalizedText'
          nullable: true
        manualLocation:
          $ref: '#/components/schemas/EventManualLocation'
          nullable: true
        locationPoint:
          $ref: '#/components/schemas/EventLocationPoint'
          nullable: true
        latitude:
          type:
            - number
            - 'null'
        longitude:
          type:
            - number
            - 'null'
        ticketUrl:
          type:
            - string
            - 'null'
        ticketCurrency:
          type:
            - string
            - 'null'
        ticketNotes:
          type:
            - string
            - 'null'
        officialWebsite:
          type:
            - string
            - 'null'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        schedule:
          $ref: '#/components/schemas/EventSchedule'
          nullable: true
        weeks:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/EventWeek'
        eventDays:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/EventDay'
        timeZone:
          type:
            - string
            - 'null'
        timeZoneCity:
          type:
            - string
            - 'null'
        timeZoneProvince:
          type:
            - string
            - 'null'
        timeZoneCountry:
          type:
            - string
            - 'null'
        timeZoneStateAnsi:
          type:
            - string
            - 'null'
        timeZoneLat:
          type:
            - number
            - 'null'
        timeZoneLng:
          type:
            - number
            - 'null'
        startTime:
          type:
            - string
            - 'null'
        endTime:
          type:
            - string
            - 'null'
        dayRolloverHour:
          type:
            - integer
            - 'null'
        stageOrder:
          type:
            - array
            - 'null'
          items:
            type: string
        coverImageUrl:
          type:
            - string
            - 'null'
        lineupImageUrl:
          type:
            - string
            - 'null'
        imageAssets:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/EventImageAsset'
        ticketTiers:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/EventTicketTierInput'
        lineupArtists:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/EventLineupArtistInput'
        lineupSlots:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/EventLineupSlotInput'
        lineupSyncMode:
          type:
            - string
            - 'null'
          enum:
            - incremental_fill
            - exact_align
            - null
        idempotencyKey:
          type:
            - string
            - 'null'
        status:
          type:
            - string
            - 'null'
          enum:
            - draft
            - upcoming
            - ongoing
            - ended
            - cancelled
            - canceled
            - null
