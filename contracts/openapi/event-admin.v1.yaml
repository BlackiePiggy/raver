            - 'null'
        ticketUrl:
          type:
            - string
            - 'null'
        ticketCurrency:
          type:
            - string
            - 'null'
        ticketNotes:
          type:
            - string
            - 'null'
        officialWebsite:
          type:
            - string
            - 'null'
        status:
          type:
            - string
            - 'null'
        revision:
          type:
            - integer
            - 'null'
        ticketTiers:
          type:
            - array
            - 'null'
          items:
