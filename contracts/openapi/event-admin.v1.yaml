openapi: 3.1.0
info:
  title: Raver Event Admin Contract
  version: 1.0.0
  summary: Unified Event admin and upload contract for Web and iOS.
  description: |
    First-stage contract source for Event create/edit flows shared by Web admin and iOS upload flow.

    This contract reflects the current project direction:
    - Event create/edit uses full payload only.
    - Event update keeps HTTP PATCH, but the payload is not patch-only.
    - Fields whose omission is different from explicit clearing must use clear* flags.
servers:
  - url: /v1
tags:
  - name: Event Admin
    description: Event create, edit, read, and alignment preview endpoints used by Web admin and iOS.
paths:
  /events:
    post:
      tags:
        - Event Admin
      summary: Create event
      operationId: createEvent
      description: |
        Creates an event directly for privileged roles, or queues a content submission for review.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventInput'
      responses:
        '200':
          description: Event created directly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventEnvelope'
        '202':
          description: Submission accepted for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubmissionAcceptedEnvelope'
        '400':
          description: Invalid event payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
        '409':
          description: Active edit submission already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
  /events/{eventId}:
    get:
      tags:
        - Event Admin
      summary: Get event detail
      operationId: getEventDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailEnvelope'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
    patch:
      tags:
        - Event Admin
      summary: Update event
      operationId: updateEvent
      description: |
        Updates an event using full payload semantics.

        Important contract rules:
        - This endpoint uses PATCH as the HTTP verb, but clients must submit the full event editing state.
        - Patch-only baseline or per-field diff payloads are not part of this contract.
        - For fields where omission differs from clearing, clients must use explicit clear* flags.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventInput'
      responses:
        '200':
          description: Event updated directly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventEnvelope'
        '202':
          description: Edit submission accepted for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubmissionAcceptedEnvelope'
        '400':
          description: Invalid event payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
        '409':
          description: Active edit submission already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
  /events/lineup-timetable-alignment/preview:
    post:
      tags:
        - Event Admin
      summary: Preview lineup and timetable alignment
      operationId: previewEventLineupTimetableAlignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventInput'
      responses:
        '200':
          description: Alignment preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAlignmentPreviewEnvelope'
        '400':
          description: Invalid event payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    EventScheduleMode:
      type: string
      enum:
        - single_day
        - multi_day
        - multi_week
    EventLineupSyncMode:
      type: string
      enum:
        - incremental_fill
        - exact_align
    EventMutationStatus:
      type: string
      enum:
        - draft
        - upcoming
        - ongoing
        - ended
        - cancelled
        - canceled
    EventApiErrorCode:
      type: string
      enum:
        - ACTIVE_EVENT_EDIT_SUBMISSION_EXISTS
        - EVENT_SUBMISSION_INVALID_PAYLOAD
    GenericApiError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
        message:
          type: string
      oneOf:
        - required: [error]
        - required: [message]
    EventApiErrorDetails:
      type: object
      additionalProperties: false
      properties:
        targetEventId:
          type: string
        activeSubmissionId:
          type: string
        activeSubmissionStatus:
          type: string
    EventApiError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
        message:
          type: string
        code:
          $ref: '#/components/schemas/EventApiErrorCode'
        details:
          $ref: '#/components/schemas/EventApiErrorDetails'
      oneOf:
        - required: [error]
        - required: [message]
    LocalizedText:
      type: object
      additionalProperties: false
      required:
        - en
        - zh
      properties:
        en:
          type: string
        zh:
          type: string
        ja:
          type:
            - string
            - 'null'
        enFull:
          type:
            - string
            - 'null'
    EventLocationCoordinate:
      type: object
      additionalProperties: false
      required:
        - lng
        - lat
      properties:
        lng:
          type: number
        lat:
          type: number
    EventManualLocation:
      type: object
      additionalProperties: false
      required:
        - detailAddressI18n
        - formattedAddressI18n
        - selectedAt
      properties:
        detailAddressI18n:
          $ref: '#/components/schemas/LocalizedText'
        formattedAddressI18n:
          $ref: '#/components/schemas/LocalizedText'
        selectedAt:
          type: string
          format: date-time
    EventLocationPoint:
      type: object
      additionalProperties: false
      required:
        - provider
        - sourceMode
        - location
      properties:
        provider:
          type: string
        sourceMode:
          type: string
        providerPlaceId:
          type:
            - string
            - 'null'
        poiId:
          type:
            - string
            - 'null'
        location:
          $ref: '#/components/schemas/EventLocationCoordinate'
        nameI18n:
          $ref: '#/components/schemas/LocalizedText'
          nullable: true
        addressI18n:
          $ref: '#/components/schemas/LocalizedText'
          nullable: true
        formattedAddressI18n:
          $ref: '#/components/schemas/LocalizedText'
          nullable: true
        city:
          type:
            - string
            - 'null'
        district:
          type:
            - string
            - 'null'
        province:
          type:
            - string
            - 'null'
        countryCode:
          type:
            - string
            - 'null'
    EventSchedule:
      type: object
      additionalProperties: false
      required:
        - mode
        - timeZone
        - dayRolloverHour
      properties:
        mode:
          $ref: '#/components/schemas/EventScheduleMode'
        timeZone:
          type: string
        dayRolloverHour:
          type: integer
    EventWeek:
      type: object
      additionalProperties: false
      required:
        - weekIndex
        - startDate
        - endDate
      properties:
        id:
          type:
            - string
            - 'null'
        weekIndex:
          type: integer
        label:
          type:
            - string
            - 'null'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        sortOrder:
          type:
            - integer
            - 'null'
    EventDay:
      type: object
      additionalProperties: false
      required:
        - eventDayId
        - weekIndex
        - dayIndexInWeek
        - overallDayIndex
        - date
      properties:
        id:
          type:
            - string
            - 'null'
        eventDayId:
          type: string
        weekIndex:
          type: integer
        dayIndexInWeek:
          type: integer
        overallDayIndex:
          type: integer
        label:
          type:
            - string
            - 'null'
        weekday:
          type:
            - string
            - 'null'
        date:
          type: string
          format: date
        sortOrder:
          type:
            - integer
            - 'null'
    EventImageAsset:
