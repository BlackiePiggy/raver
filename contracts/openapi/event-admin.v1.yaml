            - string
            - 'null'
        manualLocation:
          $ref: '#/components/schemas/EventManualLocation'
          nullable: true
        locationPoint:
          $ref: '#/components/schemas/EventLocationPoint'
          nullable: true
        latitude:
          type:
            - number
            - 'null'
        longitude:
          type:
            - number
            - 'null'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        schedule:
          $ref: '#/components/schemas/EventSchedule'
          nullable: true
        weeks:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/EventWeek'
        eventDays:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/EventDay'
        stageOrder:
          type:
            - array
            - 'null'
          items:
            type: string
        lineupArtists:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/EventLineupArtistInput'
        lineupSlots:
