        - title
      properties:
        id:
          type: string
        entityType:
          type: string
        status:
          type: string
        title:
          type: string
        reviewReason:
          type:
            - string
            - 'null'
        createdEntityId:
          type:
            - string
            - 'null'
        createdAt:
          type:
            - string
            - 'null'
          format: date-time
        updatedAt:
          type:
            - string
            - 'null'
