openapi: 3.1.0
info:
  title: Raver Event Admin Contract
  version: 1.0.0
  summary: Unified Event admin and upload contract for Web and iOS.
  description: |
    First-stage contract source for Event create/edit flows shared by Web admin and iOS upload flow.

    This contract reflects the current project direction:
    - Event create/edit uses full payload only.
    - Event update keeps HTTP PATCH, but the payload is not patch-only.
    - Fields whose omission is different from explicit clearing must use clear* flags.
servers:
  - url: /v1
tags:
  - name: Event Admin
    description: Event create, edit, read, and alignment preview endpoints used by Web admin and iOS.
paths:
  /events:
    post:
      tags:
        - Event Admin
      summary: Create event
      operationId: createEvent
      description: |
        Creates an event directly for privileged roles, or queues a content submission for review.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventInput'
      responses:
        '200':
          description: Event created directly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventEnvelope'
        '202':
          description: Submission accepted for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubmissionAcceptedEnvelope'
        '400':
          description: Invalid event payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
        '409':
          description: Active edit submission already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
  /events/{eventId}:
    get:
      tags:
        - Event Admin
      summary: Get event detail
      operationId: getEventDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailEnvelope'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
  /events/{eventId}/summary:
    get:
      tags:
        - Event Admin
      summary: Get event overview
      operationId: getEventOverview
      description: |
        Returns the lightweight event overview payload used for summary/overview surfaces.
        This payload intentionally excludes the heavy lineup and timetable collections so
        clients can render media, schedule summary, ticket summary, and base metadata
        without loading full event detail.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Event overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOverviewEnvelope'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
    patch:
      tags:
        - Event Admin
      summary: Update event
      operationId: updateEvent
      description: |
        Updates an event using full payload semantics.

        Important contract rules:
        - This endpoint uses PATCH as the HTTP verb, but clients must submit the full event editing state.
        - Patch-only baseline or per-field diff payloads are not part of this contract.
        - For fields where omission differs from clearing, clients must use explicit clear* flags.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventInput'
      responses:
        '200':
          description: Event updated directly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventEnvelope'
        '202':
          description: Edit submission accepted for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubmissionAcceptedEnvelope'
        '400':
          description: Invalid event payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
        '409':
          description: Active edit submission already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
  /events/lineup-timetable-alignment/preview:
    post:
      tags:
        - Event Admin
      summary: Preview lineup and timetable alignment
      operationId: previewEventLineupTimetableAlignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventInput'
      responses:
        '200':
          description: Alignment preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAlignmentPreviewEnvelope'
        '400':
          description: Invalid event payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    EventScheduleMode:
      type: string
      enum:
        - single_day
        - multi_day
        - multi_week
    EventLineupSyncMode:
      type: string
      enum:
        - incremental_fill
        - exact_align
    EventMutationStatus:
      type: string
      enum:
        - draft
        - upcoming
        - ongoing
        - ended
        - cancelled
        - canceled
    EventApiErrorCode:
      type: string
      enum:
        - ACTIVE_EVENT_EDIT_SUBMISSION_EXISTS
        - EVENT_SUBMISSION_INVALID_PAYLOAD
    GenericApiError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
        message:
          type: string
      oneOf:
        - required: [error]
        - required: [message]
    EventApiErrorDetails:
      type: object
      additionalProperties: false
      properties:
        targetEventId:
          type: string
        activeSubmissionId:
          type: string
        activeSubmissionStatus:
          type: string
    EventApiError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
        message:
          type: string
        code:
          $ref: '#/components/schemas/EventApiErrorCode'
        details:
          $ref: '#/components/schemas/EventApiErrorDetails'
      oneOf:
        - required: [error]
        - required: [message]
    LocalizedText:
      type: object
      additionalProperties: false
      required:
        - en
        - zh
      properties:
        en:
          type: string
        zh:
          type: string
        ja:
          type:
            - string
            - 'null'
        enFull:
          type:
            - string
            - 'null'
    EventLocationCoordinate:
      type: object
      additionalProperties: false
      required:
        - lng
        - lat
      properties:
        lng:
          type: number
        lat:
          type: number
    EventManualLocation:
      type: object
      additionalProperties: false
      required:
        - detailAddressI18n
        - formattedAddressI18n
        - selectedAt
      properties:
        detailAddressI18n:
          $ref: '#/components/schemas/LocalizedText'
        formattedAddressI18n:
          $ref: '#/components/schemas/LocalizedText'
        selectedAt:
          type: string
          format: date-time
    EventLocationProvider:
      type: string
      description: Canonical map/location provider identifier.
      enum:
        - amap
        - google
        - mapkit
        - mapbox
        - geoapify
    EventLocationSourceMode:
      type: string
      description: Canonical location acquisition mode.
      enum:
        - manual_search
        - pin_drag
        - map_poi_click
        - my_location
        - legacy_coords
    EventLocationProviderMetaAmap:
      type: object
      additionalProperties: false
      properties:
        poiId:
          type:
            - string
            - 'null'
        adcode:
          type:
            - string
            - 'null'
    EventLocationProviderMetaGoogle:
      type: object
      additionalProperties: false
      properties:
        placeId:
          type:
            - string
            - 'null'
        types:
          type:
            - array
            - 'null'
          items:
            type: string
    EventLocationProviderMetaMapkit:
      type: object
      additionalProperties: false
      properties:
        mapItemIdentifier:
          type:
            - string
            - 'null'
    EventLocationProviderMetaMapbox:
      type: object
      additionalProperties: false
      properties:
        placeId:
          type:
            - string
            - 'null'
        featureType:
          type:
            - string
            - 'null'
    EventLocationProviderMetaGeoapify:
      type: object
      additionalProperties: false
      properties:
        placeId:
          type:
            - string
            - 'null'
        featureType:
          type:
            - string
            - 'null'
    EventLocationProviderMeta:
      type: object
      additionalProperties: false
      properties:
        amap:
          allOf:
            - $ref: '#/components/schemas/EventLocationProviderMetaAmap'
          nullable: true
        google:
          allOf:
            - $ref: '#/components/schemas/EventLocationProviderMetaGoogle'
          nullable: true
        mapkit:
          allOf:
            - $ref: '#/components/schemas/EventLocationProviderMetaMapkit'
          nullable: true
        mapbox:
          allOf:
            - $ref: '#/components/schemas/EventLocationProviderMetaMapbox'
          nullable: true
        geoapify:
          allOf:
            - $ref: '#/components/schemas/EventLocationProviderMetaGeoapify'
          nullable: true
    EventLocationPoint:
      type: object
      additionalProperties: false
      required:
        - provider
        - sourceMode
        - location
      properties:
        provider:
          $ref: '#/components/schemas/EventLocationProvider'
        sourceMode:
          $ref: '#/components/schemas/EventLocationSourceMode'
        providerPlaceId:
          type:
            - string
            - 'null'
        poiId:
          type:
            - string
            - 'null'
        adcode:
          type:
            - string
            - 'null'
        location:
          $ref: '#/components/schemas/EventLocationCoordinate'
        nameI18n:
          $ref: '#/components/schemas/LocalizedText'
          nullable: true
        addressI18n:
          $ref: '#/components/schemas/LocalizedText'
          nullable: true
        formattedAddressI18n:
          $ref: '#/components/schemas/LocalizedText'
          nullable: true
        city:
          type:
            - string
            - 'null'
        district:
          type:
            - string
            - 'null'
        province:
          type:
            - string
            - 'null'
        countryCode:
          type:
            - string
            - 'null'
        providerMeta:
          allOf:
            - $ref: '#/components/schemas/EventLocationProviderMeta'
          nullable: true
    EventSchedule:
      type: object
      additionalProperties: false
      required:
        - mode
        - timeZone
        - dayRolloverHour
      properties:
        mode:
          $ref: '#/components/schemas/EventScheduleMode'
        timeZone:
          type: string
        dayRolloverHour:
          type: integer
    EventWeek:
      type: object
      description: Canonical structured week row. On write/update, week identity is keyed by weekIndex.
      additionalProperties: false
      required:
        - weekIndex
        - startDate
        - endDate
      properties:
        id:
          type:
            - string
            - 'null'
          description: Legacy database identifier surfaced for hydration only. Ignored on write/update.
        weekIndex:
          type: integer
          description: Stable canonical identity key for week rows on write/update.
        label:
          type:
            - string
            - 'null'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        sortOrder:
          type:
            - integer
            - 'null'
    EventDay:
      type: object
      description: Canonical structured event-day row. On write/update, event-day identity is keyed by eventDayId.
      additionalProperties: false
      required:
        - eventDayId
        - weekIndex
        - dayIndexInWeek
        - overallDayIndex
        - date
      properties:
        id:
          type:
            - string
            - 'null'
          description: Legacy database identifier surfaced for hydration only. Ignored on write/update.
        eventDayId:
          type: string
          description: Stable canonical identity key for event-day rows on write/update.
        weekIndex:
          type: integer
        dayIndexInWeek:
          type: integer
        overallDayIndex:
          type: integer
        label:
          type:
            - string
            - 'null'
        weekday:
          type:
            - string
            - 'null'
        date:
          type: string
          format: date
        sortOrder:
          type:
            - integer
            - 'null'
    EventImageAsset:
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
        type:
          type:
            - string
            - 'null'
        label:
          type:
            - string
            - 'null'
        sort:
          type:
            - integer
            - 'null'
        order:
          type:
            - integer
            - 'null'
        source:
          type:
            - string
            - 'null'
        fileName:
          type:
            - string
            - 'null'
    EventTicketTierInput:
      type: object
      description: Ticket tiers are replace-all on create/update. The collection is rewritten in submitted order or sortOrder; tier id is not a stable update key.
      additionalProperties: false
      required:
        - name
        - price
      properties:
        id:
          type:
            - string
            - 'null'
          description: Ignored on write/update. Ticket tiers do not currently support stable per-row patch semantics.
        name:
          type: string
        price:
          type: number
        currency:
          type:
            - string
            - 'null'
        sortOrder:
          type:
            - integer
            - 'null'
    EventLineupArtistInput:
      type: object
      additionalProperties: false
      required:
        - djName
      properties:
        id:
          type:
            - string
            - 'null'
        djId:
          type:
            - string
            - 'null'
        memberDjIds:
          type:
            - array
            - 'null'
          items:
            type:
              - string
              - 'null'
        memberNames:
          type:
            - array
            - 'null'
          items:
            type: string
        djName:
          type: string
        sortOrder:
          type:
            - integer
            - 'null'
    EventLineupSlotInput:
      type: object
      additionalProperties: false
      required:
        - djName
      properties:
        id:
          type:
            - string
            - 'null'
        lineupArtistId:
          type:
            - string
            - 'null'
        eventDayId:
          type:
            - string
            - 'null'
        weekIndex:
          type:
            - integer
            - 'null'
        dayIndexInWeek:
          type:
            - integer
            - 'null'
        overallDayIndex:
          type:
            - integer
            - 'null'
        localDate:
          type:
            - string
            - 'null'
          format: date
        djId:
          type:
            - string
            - 'null'
        memberDjIds:
          type:
            - array
            - 'null'
          items:
            type:
              - string
              - 'null'
        memberNames:
          type:
            - array
            - 'null'
          items:
            type: string
        festivalDayIndex:
          type:
            - integer
            - 'null'
        djName:
          type: string
        stageName:
          type:
            - string
            - 'null'
          description: When omitted or blank, clients must fallback to the first explicit stageOrder entry; otherwise use Main Stage.
        sortOrder:
          type:
            - integer
            - 'null'
        startTime:
          type:
            - string
            - 'null'
          description: Event-local logical datetime string without timezone, formatted as YYYY-MM-DDTHH:mm:ss.
        endTime:
          type:
            - string
            - 'null'
          description: Event-local logical datetime string without timezone, formatted as YYYY-MM-DDTHH:mm:ss.
    EventMutationBase:
      type: object
      additionalProperties: false
      required:
        - name
        - startDate
        - endDate
      properties:
        name:
          type: string
        nameI18n:
          $ref: '#/components/schemas/LocalizedText'
          nullable: true
        wikiFestivalId:
          type:
            - string
            - 'null'
        abbreviation:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
        eventType:
          type:
            - string
            - 'null'
        organizerName:
          type:
            - string
            - 'null'
        venueName:
          type:
            - string
            - 'null'
        venueAddress:
          type:
            - string
            - 'null'
        sourceEventUrl:
          type:
            - string
            - 'null'
        sourceProvider:
          type:
            - string
            - 'null'
        referenceLinks:
          type:
            - array
            - 'null'
          items:
            type: string
        socialLinks:
          nullable: true
        city:
          type:
            - string
            - 'null'
        cityI18n:
          $ref: '#/components/schemas/LocalizedText'
          nullable: true
        country:
          type:
            - string
            - 'null'
        countryI18n:
          $ref: '#/components/schemas/LocalizedText'
          nullable: true
        manualLocation:
          $ref: '#/components/schemas/EventManualLocation'
          nullable: true
        locationPoint:
          $ref: '#/components/schemas/EventLocationPoint'
          nullable: true
        latitude:
          type:
            - number
            - 'null'
        longitude:
          type:
            - number
            - 'null'
        ticketUrl:
          type:
            - string
            - 'null'
        ticketCurrency:
          type:
            - string
            - 'null'
        ticketNotes:
          type:
            - string
            - 'null'
        officialWebsite:
          type:
            - string
            - 'null'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        schedule:
          $ref: '#/components/schemas/EventSchedule'
          nullable: true
        weeks:
          type:
            - array
            - 'null'
          description: Full structured schedule week collection, keyed by weekIndex on write/update.
          items:
            $ref: '#/components/schemas/EventWeek'
        eventDays:
          type:
            - array
            - 'null'
          description: Full structured schedule event-day collection, keyed by eventDayId on write/update.
          items:
            $ref: '#/components/schemas/EventDay'
        timeZone:
          type:
            - string
            - 'null'
        timeZoneCity:
          type:
            - string
            - 'null'
        timeZoneProvince:
          type:
            - string
            - 'null'
        timeZoneCountry:
          type:
            - string
            - 'null'
        timeZoneStateAnsi:
          type:
            - string
            - 'null'
        timeZoneLat:
          type:
            - number
            - 'null'
        timeZoneLng:
          type:
            - number
            - 'null'
        startTime:
          type:
            - string
            - 'null'
        endTime:
          type:
            - string
            - 'null'
        dayRolloverHour:
          type:
            - integer
            - 'null'
        stageOrder:
          type:
            - array
            - 'null'
          items:
            type: string
        coverImageUrl:
          type:
            - string
            - 'null'
        lineupImageUrl:
          type:
            - string
            - 'null'
        imageAssets:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/EventImageAsset'
        ticketTiers:
          type:
            - array
            - 'null'
          description: Replace-all ticket tier collection on create/update. Tier row ids are ignored on write.
          items:
            $ref: '#/components/schemas/EventTicketTierInput'
        lineupArtists:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/EventLineupArtistInput'
        lineupSlots:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/EventLineupSlotInput'
        lineupSyncMode:
          type:
            - string
            - 'null'
          enum:
            - incremental_fill
            - exact_align
            - null
        idempotencyKey:
          type:
            - string
            - 'null'
        status:
          type:
            - string
            - 'null'
          enum:
            - draft
            - upcoming
            - ongoing
            - ended
            - cancelled
            - canceled
            - null
    CreateEventInput:
      allOf:
        - $ref: '#/components/schemas/EventMutationBase'
    UpdateEventInput:
      allOf:
        - $ref: '#/components/schemas/EventMutationBase'
        - type: object
          description: >
            Event updates use full-state semantics for destructive fields. Every clear flag below must be sent on
            update. For `wikiFestivalId`, `manualLocation`, `locationPoint`, `latitude`, `longitude`, `socialLinks`,
            `stageOrder`, and `lineupSlots`, clients must either send the field explicitly or set the corresponding
            clear flag to true. `clearCityI18n` and `clearCountryI18n` are destructive-only flags and must only be
            emitted from explicit user intent.
          additionalProperties: false
          required:
            - clearCityI18n
            - clearCountryI18n
            - clearWikiFestivalId
            - clearManualLocation
            - clearLocationPoint
            - clearLatitude
            - clearLongitude
            - clearSocialLinks
            - clearStageOrder
            - clearLineupSlots
          properties:
            clearCityI18n:
              type: boolean
              description: Explicitly clears cityI18n when true. Must only be emitted from explicit user intent.
            clearCountryI18n:
              type: boolean
              description: Explicitly clears countryI18n when true. Must only be emitted from explicit user intent.
            clearWikiFestivalId:
              type: boolean
              description: Explicitly clears wikiFestivalId when true. When false, wikiFestivalId must still be explicitly present in the update payload.
            clearManualLocation:
              type: boolean
              description: Explicitly clears manualLocation when true. When false, manualLocation must still be explicitly present in the update payload.
            clearLocationPoint:
              type: boolean
              description: Explicitly clears locationPoint when true. When false, locationPoint must still be explicitly present in the update payload.
            clearLatitude:
              type: boolean
              description: Explicitly clears latitude when true. When false, latitude must still be explicitly present in the update payload.
            clearLongitude:
              type: boolean
              description: Explicitly clears longitude when true. When false, longitude must still be explicitly present in the update payload.
            clearSocialLinks:
              type: boolean
              description: Explicitly clears socialLinks when true. When false, socialLinks must still be explicitly present in the update payload.
            clearStageOrder:
              type: boolean
              description: Explicitly clears stageOrder when true. When false, stageOrder must still be explicitly present in the update payload.
            clearLineupSlots:
              type: boolean
              description: Explicitly clears lineupSlots when true. When false, lineupSlots must still be explicitly present in the update payload.
    EventSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - startDate
        - endDate
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        organizerName:
          type:
            - string
            - 'null'
        city:
          type:
            - string
            - 'null'
        country:
          type:
            - string
            - 'null'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          type:
            - string
            - 'null'
    EventOverview:
      type: object
      additionalProperties: true
      description: |
