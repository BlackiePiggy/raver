        eventType:
          type:
            - string
            - 'null'
        organizerName:
          type:
            - string
            - 'null'
        venueName:
          type:
            - string
            - 'null'
        venueAddress:
          type:
            - string
            - 'null'
        sourceEventUrl:
          type:
            - string
            - 'null'
        sourceProvider:
          type:
            - string
            - 'null'
        referenceLinks:
          type:
            - array
            - 'null'
          items:
