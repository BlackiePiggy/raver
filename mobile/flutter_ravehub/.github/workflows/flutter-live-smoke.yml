name: Flutter Live Smoke

on:
  workflow_dispatch:

jobs:
  public-live-smoke:
    name: Public live endpoint smoke
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dart and Flutter dependencies
        run: flutter pub get

      - name: Run public live endpoint smoke
        run: |
          flutter test test/live_public_endpoint_smoke_test.dart \
            --dart-define=RAVEHUB_RUN_LIVE_SMOKE=true
